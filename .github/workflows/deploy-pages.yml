name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: github.event_name == 'workflow_dispatch'
        run: npm ci
      - if: github.event_name == 'workflow_dispatch'
        run: npm run lint
      - if: github.event_name == 'workflow_dispatch'
        run: npm test
      - if: github.event_name == 'workflow_dispatch'
        run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name == 'workflow_run' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: head
        name: Check this commit is still the head of main
        env:
          GIT_TERMINAL_PROMPT: '0'
          DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          if ! remote=$(timeout 30 git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" refs/heads/main); then
            echo "::warning::Could not check the head of main (git ls-remote failed). Deploying this commit anyway."
            exit 0
          fi
          head=$(printf '%s\n' "$remote" | awk '$2 == "refs/heads/main" { print $1 }')
          if [ -z "$head" ]; then
            echo "::warning::Could not check the head of main (no refs/heads/main in the git ls-remote output). Deploying this commit anyway."
            exit 0
          fi
          if [ "$head" != "$DEPLOY_SHA" ]; then
            echo "::notice::Skipping deploy. $DEPLOY_SHA is no longer the head of main ($head is). The run for the newer commit will deploy."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - id: deployment
        if: steps.head.outputs.stale != 'true'
        uses: actions/deploy-pages@v5
