name: CI

# One workflow checks and deploys. Every pull request to main and every push
# to main runs lint, tests and the build. A push to main then deploys the
# build to GitHub Pages.
# Changes that touch only docs (`docs/**` and `*.md`) start no run at all.
# Runs for main share one concurrency group without cancelling, so they run
# one after another and the newest commit deploys last. See ADR 0033.
on:
  pull_request:
    branches: [main]
    paths-ignore: &docs_only
      - 'docs/**'
      - '*.md'
  push:
    branches: [main]
    paths-ignore: *docs_only
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
